<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>クリエイティブチェックシート</title>
<meta name="description" content="バイオエステBTB SMS/HTMLメールCRレビュー">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root{
    --grad-1:#5F82FF;
    --grad-2:#6D5EF5;
    --grad-3:#7B4FF0;
    --ink:#2c2c30;
    --ink-dim:#6b6a85;
    --line:#e6e4f5;
    --accent:#6D5EF5;
    --accent-soft:#eeecff;
    --panel:#ffffffee;
    --panel-solid:#ffffff;
    --grid-line:#e5e3f2;
    --grid-head:#f7f6fd;
  }
  *{box-sizing:border-box}
  html, body{height:100%}
  body{
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans",sans-serif;
    margin:0; padding:0; padding-block:0;
    background:#ffffff;
    overflow:hidden; /* app-shell: header/sidebar fixed, only main scrolls */
  }
  a{color:inherit}

  .shell{
    display:grid;
    grid-template-columns:240px 1fr;
    grid-template-rows:5px 50px 1fr;
    grid-template-areas:
      "accent accent"
      "header header"
      "sidebar main";
    height:100vh;
  }

  .accent-bar{
    grid-area:accent;
    background:linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
  }

  header.topbar{
    grid-area:header;
    display:flex; align-items:center;
    padding-inline:22px;
    background:#ffffff;
    border-bottom:1px solid var(--line);
    color:#3a3a3e;
    z-index:5;
  }
  header.topbar h1{font-size:16.5px; margin:0; font-weight:700; letter-spacing:.03em; color:#434343; font-family:"Noto Sans JP","Noto Sans",sans-serif}

  nav.lps{
    grid-area:sidebar;
    background:#fff;
    border-right:1px solid var(--line);
    box-shadow:2px 0 10px -4px #00000018;
    padding:14px 10px;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:3px;
    position:relative; z-index:3;
  }
  nav.lps .nav-caption{
    font-size:10.5px; color:var(--ink-dim); letter-spacing:.1em;
    text-transform:uppercase; padding:8px 10px 6px;
  }
  nav.lps button{
    all:unset; cursor:pointer; padding:8px 11px; border-radius:6px;
    font-size:13px; color:var(--ink);
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    border-left:2px solid transparent;
  }
  nav.lps button:hover{background:var(--grid-head)}
  nav.lps button.active{
    background:var(--accent-soft);
    color:var(--accent); font-weight:700;
    border-left:2px solid var(--accent);
  }
  nav.lps button .tag{font-size:10.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums}
  nav.lps button.active .tag{color:var(--accent)}

  main{
    grid-area:main;
    overflow:auto;
    padding:0 28px 60px;
  }

  .head{display:flex; flex-direction:column; gap:2px; margin-bottom:14px; padding-top:24px}
  .head .eyebrow{font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums}
  .head h2{margin:0; font-size:21px; color:#434343; font-weight:900; font-family:"Noto Sans JP","Noto Sans",sans-serif}

  .sheet-tabs{display:flex; gap:2px; margin-bottom:0}
  .sheet-tabs button{
    all:unset; cursor:pointer;
    padding:10px 22px;
    font-size:13px; font-weight:700;
    color:var(--ink-dim);
    background:#efefef;
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:0;
    position:relative; top:1px;
  }
  .sheet-tabs button.active{
    background:var(--panel-solid);
    color:var(--accent);
    border-color:var(--line);
  }

  .sheet-panel{
    border:none;
    background:transparent;
    padding:0;
    margin-bottom:24px;
  }

  .edit-hint{
    font-size:11px; color:var(--ink-dim); margin:0 0 0; padding:8px 14px 0;
    display:flex; align-items:center; gap:6px;
  }
  .edit-hint .dot{width:6px; height:6px; border-radius:50%; background:#3ecf8e}
  .edit-hint .dot.off{background:#c9c7dd}

  .sheet-wrap{
    border:1px solid var(--grid-line);
    border-radius:0 8px 8px 8px;
    overflow:visible;
    background:var(--panel-solid);
    width:max-content;
    min-width:100%;
    box-shadow:0 12px 28px -14px #00000030;
  }
  table.sheet{border-collapse:collapse; font-size:13px; width:max-content; min-width:100%}
  table.sheet th, table.sheet td{
    border:1px solid var(--grid-line);
    padding:3px 10px;
    text-align:left;
    vertical-align:top;
    white-space:pre-wrap;
    line-height:1.3;
  }
  table.sheet thead th{
    background:#efefef; color:var(--ink-dim); font-weight:700;
    position:sticky; top:0; z-index:2; min-width:112px;
    padding:12px 10px;
    text-align:center; vertical-align:middle;
  }
  table.sheet tbody th{
    background:#efefef; color:var(--ink-dim); font-weight:700;
    position:sticky; left:0; z-index:1; min-width:110px;
  }
  table.sheet td{min-width:112px; max-width:220px}
  table.sheet tr.sms-row td{font-size:12px; min-width:160px; line-height:1.5; padding:10px}
  table.sheet tr.center-row td{text-align:center; vertical-align:middle}
  table.sheet tr.vcenter-row td{vertical-align:middle}
  table.sheet tr.preview-row td{padding:10px; vertical-align:top; text-align:center}
  table.sheet tr.preview-row td img{display:block; width:100%; max-width:220px; margin:0 auto}
  table.sheet tr.preview-row .long-stack{max-width:220px; margin:0 auto}
  table.sheet tr.preview-row .long-stack img{margin:0}
  table.sheet tr.preview-row .long-stack img:first-child{border-radius:4px 4px 0 0}
  table.sheet tr.preview-row .long-stack img:last-child{border-radius:0 0 4px 4px}

  .gm{text-align:left;padding:8px 6px 10px;border-bottom:1px solid #e8eaed;margin-bottom:8px}
  .gm-subj{font-weight:700;font-size:13px;white-space:normal}
  .gm-acct{font-size:12px;color:#5f6368;margin-top:4px}
  .gm-to{font-size:11px;color:#80868b}
  .gm-txt{text-align:center;font-size:12px;line-height:1.7;margin-top:10px;white-space:normal}
  .gm-txt a{color:#1a73e8}
  .gm-unsub{text-align:center;margin:10px 0 4px}
  .gm-unsub a{display:inline-block;padding:6px 14px;border:1px solid #bbb;border-radius:999px;color:#333;font-size:12px;text-decoration:none}

  table.sheet{border-collapse:separate; border-spacing:0; border-top:1px solid var(--grid-line); border-left:1px solid var(--grid-line)}
  table.sheet th, table.sheet td{border:0; border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line)}
  table.sms-sheet td, table.sms-sheet th:not(:first-child){width:240px; min-width:240px; max-width:240px}
  table.sms-sheet th:first-child{width:110px; min-width:110px; max-width:110px}
  [contenteditable="true"]{outline:none; cursor:text}
  [contenteditable="true"]:hover{background:var(--accent-soft)}
  [contenteditable="true"]:focus{background:#fff; box-shadow:inset 0 0 0 2px var(--accent)}

  .row-label-cell{display:flex; align-items:center; gap:6px; white-space:nowrap}
  .row-label-cell .label-text{flex:1; min-width:60px}
  .reorder-btns{display:flex; flex-direction:column; gap:1px}
  .reorder-btns button{
    all:unset; cursor:pointer; font-size:9px; line-height:1;
    color:var(--ink-dim); padding:2px 3px; border-radius:3px;
  }
  .reorder-btns button:hover{background:#ffffff; color:var(--accent)}
  .reorder-btns button:disabled{opacity:.25; cursor:default}
  .reorder-btns button:disabled:hover{background:none; color:var(--ink-dim)}

  [hidden]{display:none!important}

  @media (max-width:760px){
    .shell{
      grid-template-columns:1fr;
      grid-template-rows:5px 50px auto 1fr;
      grid-template-areas:
        "accent"
        "header"
        "sidebar"
        "main";
      height:auto; min-height:100vh;
    }
    body{overflow:auto}
    nav.lps{flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch; border-right:none; border-bottom:1px solid var(--line)}
    nav.lps button{white-space:nowrap; flex:0 0 auto}
    nav.lps button .tag{display:none}
    main{overflow-y:visible}
  }
</style>

<div class="shell">
  <div class="accent-bar"></div>
  <header class="topbar">
    <h1>クリエイティブチェックシート</h1>
  </header>
  <nav class="lps" id="lpNav"></nav>
  <main>
    <div class="head">

        <table class="sheet" id="dataTable"></table>
      </div>
    </div>
  </main>
</div>

<script>

const SEED_VERSION = "20261002143527"; // SEEDの内容を更新するたびに値を変える(dbの古いデータより優先させるため)

BTB】こんなセルライトはありませんか？", "【バイオエステBTB】最新マシンでセルライトを徹底ケア", "【バイオエステBTB】施術の流れと、安心の理由", "【バイオエステBTB】20万人が選んだ本格セルライトケア", "【バイオエステBTB】ビフォーアフターで変わる、憧れボディへ", "【バイオエステBTB】今すぐ予約、体験コースは先着制", "【バイオエステBTB】理想のスリムボディへ、最後の一歩を"]], "msgCount": 10, "sharedLong": false, "longImages": [["v2_msg1_part1.jpg", "v2_msg1_part2.jpg", "v2_msg1_part3.jpg", "v2_msg1_part4.jpg", "v2_msg1_part5.jpg", "v2_msg1_part6.jpg", "v2_msg1_part7.jpg", "v2_msg1_part8.jpg", "v2_msg1_part9.jpg"], ["h16_m1_part1.jpg", "h16_m1_part2.jpg", "h16_m1_part3.jpg"], ["v2_msg2_part1.jpg", "v2_msg2_part2.jpg", "v2_msg2_part3.jpg", "v2_msg2_part4.jpg", "v2_msg2_part5.jpg", "v2_msg2_part6.jpg", "v2_msg2_part7.jpg", "v2_msg2_part8.jpg", "v2_msg2_part9.jpg", "v2_msg2_part10.jpg", "v2_msg2_part11.jpg", "v2_msg2_part12.jpg", "v2_msg2_part13.jpg", "v2_msg2_part14.jpg"], ["h16_m2_part1.jpg", "h16_m2_part2.jpg", "h16_m2_part3.jpg"], ["m3_part1.png", "m3_part2.png", "m3_part3.png"], ["h16_m3_part1.jpg", "h16_m3_part2.jpg", "h16_m3_part3.jpg"], ["m4_part1.png", "m4_part2.png", "m4_part3.png"], ["h16_m4_part1.jpg", "h16_m4_part2.jpg", "h16_m4_part3.jpg"], ["m5_part1.png", "m5_part2.png", "m5_part3.png"], ["h16_m1_part1.jpg", "h16_m1_part2.jpg", "h16_m1_part3.jpg"]]}];

function shortUrl(label, msgN){
  return `images/${label}_msg${msgN}_short.png`;
}
// item.sharedLong=true: 全通で件名が共通の案件向け(例: 総合買取華丸)。
// part1〜6すべて全通共通の画像を使い、アップロード容量を節約する。
// それ以外(デフォルト): 通ごとに件名が異なる案件向け(標準)。part1(件名+送信者行を
// 含む)だけ通ごとに別画像、2枚目以降は本文が全通共通なのでLP単位で1枚だけ
// アップロードして使い回す(アップロード容量節約)。
function longUrl(item, msgN, partI){
  if (item.sharedLong) return `images/${item.label}_shared${partI}.png`;
  if (partI === 1) return `images/${item.label}_msg${msgN}_long_part1.jpg`;
  return `images/${item.label}_shared_long_part${partI}.jpg`;
}
const LONG_PARTS_DEFAULT = 6; // FVごとの区切りにCTAを差し込んだ構成(セクション×3 + CTA×3)
// LPごとにパーツ数が異なる場合はここに登録(例: LP19はカードがセクション境界をまたぐため
// CTAを1箇所省略しており5パーツ)
const LONG_PARTS_OVERRIDE = { lp19: 5 };

let current = SEED[0].label;
let currentSheet = 'sms';
let db = null;
let canWrite = false;

// label -> { sms: rows[], html: rows[] } (live, editable copy)
const state = {};
SEED.forEach(item => {
  state[item.label] = { sms: item.sms, html: item.html };
});

const nav = document.getElementById('lpNav');
SEED.forEach(item => {
  const btn = document.createElement('button');
  btn.innerHTML = `<span>${item.category}</span><span class="tag">${item.label}</span>`;
  btn.dataset.label = item.label;
  btn.addEventListener('click', () => { current = item.label; render(); });
  nav.appendChild(btn);
});

document.querySelectorAll('.sheet-tabs button').forEach(btn => {
  btn.addEventListener('click', () => { currentSheet = btn.dataset.sheet; render(); });
});

function escapeHtml(s){
  return (s ?? '').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const STICKY_ROWS = new Set(['送信タイミング', '狙い', '件名']);
function buildRows(rows, sheetKey, item){
  const header = rows[0];
  const body = rows.slice(1);
  const thead = `<thead><tr>${header.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>`;
  const editAttr = EDITABLE ? 'contenteditable="true"' : '';
  const CENTER_ROWS = new Set(['通数', '送信タイミング', '狙い']);
  const VCENTER_ROWS = new Set(['件名']);
  const tbody = body.map((r, ri) => {
    const isSms = r[0] === 'SMS';
    const isCentered = CENTER_ROWS.has(r[0]);
    const isVCentered = VCENTER_ROWS.has(r[0]);
    const cells = r.slice(1).map((c, ci) =>
      `<td ${editAttr} data-ri="${ri}" data-ci="${ci+1}">${escapeHtml(c)}</td>`
    ).join('');
    const reorderBtns = EDITABLE ? `
          <span class="reorder-btns">
            <button data-move="up" data-ri="${ri}" ${ri===0?'disabled':''}>▲</button>
            <button data-move="down" data-ri="${ri}" ${ri===body.length-1?'disabled':''}>▼</button>
          </span>` : '';
    return `<tr class="${isSms ? 'sms-row' : ''} ${(sheetKey === 'html' && STICKY_ROWS.has(r[0])) ? 'stk' : ''} ${isCentered ? 'center-row' : ''} ${isVCentered ? 'vcenter-row' : ''}">
      <th>
        <div class="row-label-cell">
          <span class="label-text" ${editAttr} data-ri="${ri}" data-ci="0">${escapeHtml(r[0])}</span>${reorderBtns}
        </div>
      </th>${cells}</tr>`;
  }).join('');
  return { thead, tbody, nCols: header.length - 1 };
}

function buildPreviewRow(item, nCols){
  // 通数ごとに1列ずつ、その通の件名を使ったロング版(FV区切りCTA入り)を表示する。
  // item.longImages: [["b15_msg1_long_part1.jpg","b15_shared_long_part2.jpg",...], ...]
  // のように通番(msgN、1始まり)ごとに表示する画像ファイル名(images/配下)を明示的に
  // 指定する(通ごとに参照元LP・パーツ数が異なるケース向け)。未指定の場合はLONG_PARTS_*と
  // longUrl()による従来の定数パーツ数方式にフォールバックする。
  const longParts = LONG_PARTS_OVERRIDE[item.label] || LONG_PARTS_DEFAULT;
  const msgCells = Array.from({length: item.msgCount || nCols}, (_, i) => i + 1).map(msgN => {
    const files = item.longImages
      ? item.longImages[msgN - 1].map(f => `images/${f}`)
      : Array.from({length: longParts}, (_, k) => longUrl(item, msgN, k + 1));
    const imgs = files.map((src, idx) => `<img src="${src}" alt="${msgN}通目 ロング版${idx + 1}">`).join('');
    const subjRow = (state[current].html.find(r => r[0] === '件名') || []);
    const subj = subjRow[msgN] || '';
    return `<td><div class="gm"><div class="gm-subj">${escapeHtml(subj)}</div><div class="gm-acct">バイオエステBTB【公式】</div><div class="gm-to">To 自分</div></div><div class="long-stack">${imgs}</div><div class="gm-txt">お客様のご利用を心よりお待ちしております。<br><br><a href="{{アフィリンク}}">バイオエステBTB公式ウェブサイトはこちら</a><br><br>※すでにお申し込み完了メールが届いている場合は、お申し込みは完了しております。その場合は、大変お手数をおかけしますが、本メールは破棄していただきますようお願いいたします。</div><div class="gm-unsub"><a href="https://tsuiseki.online/stop/email/1360" target="_blank">配信停止はこちら</a></div></td>`;
  }).join('');
  const emptyCells = Array.from({length: Math.max(0, nCols - (item.msgCount || nCols))}).map(() => '<td></td>').join('');
  return `<tr class="preview-row"><th>プレビュー</th>${msgCells}${emptyCells}</tr>`;
}

function render(){
  const item = SEED.find(d => d.label === current);
  const rows = state[current][currentSheet];

  document.getElementById('lpTitle').textContent = item.category;
  document.getElementById('lpLabel').textContent = item.label;

  [...nav.children].forEach(b => b.classList.toggle('active', b.dataset.label === current));
  document.querySelectorAll('.sheet-tabs button').forEach(b => b.classList.toggle('active', b.dataset.sheet === currentSheet));

  const { thead, tbody, nCols } = buildRows(rows, currentSheet, item);
  const table = document.getElementById('dataTable');
  table.innerHTML = thead + '<tbody>' + tbody + (currentSheet === 'html' ? buildPreviewRow(item, nCols) : '') + '</tbody>';
  const theadEl = table.querySelector('thead');
  table.querySelectorAll('tr.stk').forEach(tr => theadEl.appendChild(tr));
  let stickyTop = 0;
  theadEl.querySelectorAll('tr').forEach(tr => {
    const isStk = tr.classList.contains('stk');
    tr.querySelectorAll('th,td').forEach(c => {
      c.style.position = 'sticky';
      c.style.top = stickyTop + 'px';
      c.style.zIndex = '3';
      c.style.background = isStk ? '#fff' : '#efefef';
    });
    stickyTop += tr.getBoundingClientRect().height;
  });
  table.className = currentSheet === 'sms' ? 'sheet sms-sheet' : 'sheet';

  if (EDITABLE) {
    table.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('blur', onCellEdit);
    });
    table.querySelectorAll('button[data-move]').forEach(btn => {
      btn.addEventListener('click', onReorder);
    });
  }
}

let saveTimer = null;
function scheduleSave(label, sheetKey){
  clearTimeout(saveTimer);
  setStatus('saving');
  saveTimer = setTimeout(() => saveNow(label, sheetKey), 700);
}

async function saveNow(label, sheetKey){
  if (!db || !canWrite) { setStatus(canWrite ? 'idle' : 'readonly'); return; }
  try {
    await db.doc(`data/${label}_${sheetKey}`).set({ rows: state[label][sheetKey], seedVersion: SEED_VERSION });
    setStatus('saved');
  } catch (e) {
    setStatus('error');
  }
}

function setStatus(kind){
  const dot = document.getElementById('editDot');
  const text = document.getElementById('editStatus');
  if (kind === 'saving'){ dot.className = 'dot off'; text.textContent = '保存中…'; }
  else if (kind === 'saved'){ dot.className = 'dot'; text.textContent = '保存済み(全員に反映されます)'; }
  else if (kind === 'readonly'){ dot.className = 'dot off'; text.textContent = '閲覧のみ(編集権限がありません)'; }
  else if (kind === 'error'){ dot.className = 'dot off'; text.textContent = '保存に失敗しました'; }
  else { dot.className = canWrite ? 'dot' : 'dot off'; text.textContent = canWrite ? 'セルをクリックして編集できます' : '読み込み中…'; }
}

function onCellEdit(e){
  const el = e.target;
  const ri = parseInt(el.dataset.ri, 10);
  const ci = parseInt(el.dataset.ci, 10);
  const rows = state[current][currentSheet];
  const bodyRow = rows[ri + 1];
  if (!bodyRow) return;
  const newVal = el.textContent;
  if (bodyRow[ci] === newVal) return;
  bodyRow[ci] = newVal;
  scheduleSave(current, currentSheet);
}

function onReorder(e){
  const btn = e.currentTarget;
  const ri = parseInt(btn.dataset.ri, 10);
  const dir = btn.dataset.move;
  const rows = state[current][currentSheet];
  const bodyStart = 1;
  const a = bodyStart + ri;
  const b = dir === 'up' ? a - 1 : a + 1;
  if (b < bodyStart || b >= rows.length) return;
  [rows[a], rows[b]] = [rows[b], rows[a]];
  scheduleSave(current, currentSheet);
  render();
}

async function initDb(){
  try {
    if (!window.claude || !window.claude.use) { db = null; canWrite = false; }
    else {
      db = await window.claude.use('db');
      const user = await window.claude.use('user');
      canWrite = user ? !!(await user.can('data.write')) : false;
    }
  } catch (e) {
    db = null; canWrite = false;
  }
  if (!db){ setStatus('idle'); return; }

  // 初回のみ: 各LPのデータをdbに書き込み(既に存在すればそちらを使う)。
  // ただしSEED_VERSIONがdb保存時と異なる場合(=私がSEEDの内容を更新した場合)は、
  // dbの古いデータより新しいSEEDを優先して上書きする(バージョンが同じ場合のみ、
  // ユーザーがライブ編集した内容をdbから読み込んで尊重する)。
  for (const item of SEED) {
    for (const sheetKey of ['sms', 'html']) {
      try {
        const ref = db.doc(`data/${item.label}_${sheetKey}`);
        const snap = await ref.get();
        const data = snap.exists ? snap.data() : null;
        if (data && Array.isArray(data.rows) && data.seedVersion === SEED_VERSION) {
          state[item.label][sheetKey] = data.rows;
        } else if (canWrite) {
          await ref.set({ rows: state[item.label][sheetKey], seedVersion: SEED_VERSION });
        }
      } catch (e) { /* keep seed data on failure */ }
    }
  }
  setStatus('idle');
  render();
}

render();
if (EDITABLE) {
  document.getElementById('editHint').hidden = false;
  initDb();
}
</script>
