<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E4オンライン プレビュー</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f3f0;
    color: #1c1b19;
    font-family: 'Hiragino Sans', sans-serif;
    padding: 32px 16px 64px;
  }
  header { max-width: 760px; margin: 0 auto 32px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
  header p { margin: 0; color: #6b6860; font-size: 13.5px; line-height: 1.7; }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .card { background: #ffffff; border: 1px solid #e4e1da; border-radius: 12px; overflow: hidden; }
  .card-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #e4e1da; }
  .card-head .num { font-weight: 700; font-size: 15px; color: #1a6fb0; }
  .card-head .pieces { font-size: 12px; color: #6b6860; }
  .card img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>

<header>
  <h1>E4オンライン HTMLメール プレビュー（画像＋フッターテキスト込み）</h1>
  <p>各通、画像パーツの直下にフッター（HTMLテキスト化・配信停止URL付き）を付けた状態です。モバイル端末のステータスバー・件名・アカウント行は削除済み、CTAボタン下の余白は削除済みです。</p>
</header>

<main>
  <div class="card"><div class="card-head"><span class="num">1通目</span><span class="pieces">ピース 1</span></div><img src="images/full1.png" alt="1通目"></div>
  <div class="card"><div class="card-head"><span class="num">2通目</span><span class="pieces">ピース 2</span></div><img src="images/full2.png" alt="2通目"></div>
  <div class="card"><div class="card-head"><span class="num">3通目</span><span class="pieces">ピース 3+4</span></div><img src="images/full3.png" alt="3通目"></div>
  <div class="card"><div class="card-head"><span class="num">4通目</span><span class="pieces">ピース 5+6</span></div><img src="images/full4.png" alt="4通目"></div>
  <div class="card"><div class="card-head"><span class="num">5通目</span><span class="pieces">ピース 7+8</span></div><img src="images/full5.png" alt="5通目"></div>
  <div class="card"><div class="card-head"><span class="num">6通目</span><span class="pieces">ピース 9+10</span></div><img src="images/full6.png" alt="6通目"></div>
  <div class="card"><div class="card-head"><span class="num">7通目</span><span class="pieces">ピース 11+12+13</span></div><img src="images/full7.png" alt="7通目"></div>
  <div class="card"><div class="card-head"><span class="num">8通目</span><span class="pieces">ピース 14+15</span></div><img src="images/full8.png" alt="8通目"></div>
  <div class="card"><div class="card-head"><span class="num">9通目</span><span class="pieces">ピース 16+17</span></div><img src="images/full9.png" alt="9通目"></div>
  <div class="card"><div class="card-head"><span class="num">10通目</span><span class="pieces">ピース 1（1通目と同じ）</span></div><img src="images/full10.png" alt="10通目"></div>
</main>

</body>
</html>
